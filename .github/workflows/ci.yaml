name: ci
on:
  pull_request: {}

# Least-privilege default: CI only reads the repo to build and test.
permissions:
  contents: read

jobs:
  # Key-free mocked critical-path smoke gate (connect -> upsert -> query).
  # Runs on every PR with NO PINECONE_API_KEY to prove the request/response
  # plumbing works without a real backend.
  smoke-mocked:
    name: Smoke (mocked, no key)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
      - name: Install dependencies
        run: go get ./pinecone
      # No PINECONE_API_KEY in env: proves the mocked critical path needs none.
      # The `smoke` build tag + explicit -run pattern target only smoke/, and
      # `go test` exits 0 with "[no tests to run]" if the pattern matches
      # nothing (e.g. smoke/ is moved or emptied). The PASS-marker grep below is
      # the zero-test guard: it fails the job in that case rather than silently
      # passing by running nothing. `set -o pipefail` preserves a real test
      # failure's non-zero exit through the tee.
      - name: Run mocked critical-path smoke test
        run: |
          set -o pipefail
          go test -tags smoke -run '^TestMockedCriticalPath$' -v -count=1 ./smoke/... 2>&1 | tee smoke.log
          grep -q -- '--- PASS: TestMockedCriticalPath' smoke.log \
            || { echo "::error::mocked critical-path smoke test did not run"; exit 1; }

  # Unit tests for the local actions in .github/actions/. A bad bump-version
  # result becomes a public tag that the Go module proxy caches permanently.
  actions-tests:
    name: Local action tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
      # Unquoted so the shell expands the glob; node --test only expands globs itself on Node 21+.
      # A run that finds no tests can still exit 0, so fail on zero tests.
      - name: Run action tests
        run: |
          set -o pipefail
          node --test .github/actions/*/*.test.js 2>&1 | tee actions-tests.log
          grep -Eq '^# pass [1-9]' actions-tests.log \
            || { echo "::error::no local action tests ran"; exit 1; }

  build-and-test:
    runs-on: ubuntu-latest
    services:
      pc-index-serverless:
        image: ghcr.io/pinecone-io/pinecone-index:latest
        ports:
          - 5081:5081
        env:
          PORT: 5081
          DIMENSION: 1536
          METRIC: dotproduct
          INDEX_TYPE: serverless
      pc-index-pod:
        image: ghcr.io/pinecone-io/pinecone-index:latest
        ports:
          - 5082:5082
        env:
          PORT: 5082
          DIMENSION: 1536
          METRIC: cosine
          INDEX_TYPE: pod
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Install dependencies
        run: |
          go get ./pinecone
      - name: Vet and run unit tests
        run: |
          go vet -tags integration,localServer,smoke ./...
          go test -count=1 -v ./pinecone
      - name: Run local integration tests
        run: go test -count=1 -v ./pinecone -run TestRunLocalIntegrationSuite -tags=localServer -timeout=20m
        env:
          PINECONE_INDEX_URL_POD: http://localhost:5082
          PINECONE_INDEX_URL_SERVERLESS: http://localhost:5081
          PINECONE_DIMENSION: 1536

  # The keyed integration suite against production. It fails when any test fails or when no test
  # ran at all (every leaf test skipped, or none matched). A check held up by something outside the
  # SDK logs a "BLOCKED: " line (skipBlocked, logBlocked); those are counted and listed in the job
  # summary but never fail the job.
  live:
    name: Integration (live)
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: live-pinecone
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Run integration tests
        run: |
          set -o pipefail
          go test -count=1 -v -tags integration -timeout=80m ./pinecone 2>&1 | tee live.log
          grep -q -- '^--- PASS: TestRunSuites ' live.log \
            || { echo "::error::the integration suites did not run"; exit 1; }
          # Leaf tests only: a parent reports PASS even when every subtest under it skipped.
          ran=$(awk '$1 == "---" && $2 ~ /^(PASS|FAIL|SKIP):$/ { s[$3] = $2 }
            END { for (n in s) { if (s[n] == "SKIP:") continue; leaf = 1
              for (m in s) if (index(m, n "/") == 1) { leaf = 0; break }; c += leaf }; print c + 0 }' live.log)
          echo "Leaf tests run: $ran"
          [ "$ran" -gt 0 ] || { echo "::error::no integration tests ran; every test was skipped"; exit 1; }
        env:
          PINECONE_API_KEY: ${{ secrets.API_KEY }}
          PINECONE_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          PINECONE_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      - name: Blocked tests
        if: ${{ !cancelled() }}
        run: |
          grep -o -- 'BLOCKED: .*' live.log | sort | uniq -c > blocked.txt || true
          count=$(grep -c -- 'BLOCKED: ' live.log || true)
          { echo "### Blocked tests: $count"; sed 's/^/    /' blocked.txt; } >> "$GITHUB_STEP_SUMMARY"
          cat blocked.txt
